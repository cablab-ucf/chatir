[package]
name = "chatir-core"
description = "Peer-to-peer, end-to-end encrypted community chat over iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
blake3 = "1"
chacha20poly1305 = "0.11"
data-encoding = "2"
# Each code's QR, for every front end (the page's, the browser's too).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.4"
dirs = "7"
iroh = { version = "1.4", default-features = false, features = [
  "tls-aws-lc-rs", "metrics",
] }
iroh-gossip = { version = "0.102", default-features = false, features = ["net"] }
# Files kept on their sender's device: verified, resumable, any size.
iroh-blobs = { version = "0.104.0", default-features = false, features = ["fs-store"] }
iroh-mdns-address-lookup = "0.6"
# Releases are checked against the key every chatir trusts.
minisign-verify = "0.3"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
# Storage nodes wake phones; already built for iroh, TLS as iroh sets it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
x-wing = { version = "0.1", features = ["getrandom"] }
# The lab's shared network: the post-quantum endpoint and TLS (irnet), short
# codes (pairir), one relay mailbox per device (pushir: lanes and rings).
irnet = { git = "https://github.com/cablab-ucf/irnet", rev = "fbd691d1b6dd34d4d2c027b6875df3f11c918f66" }
pairir = { git = "https://github.com/cablab-ucf/pairir", rev = "653095c95194a7c9080b121da5fc77c24abc1092" }
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "5c1681ba1440387039e07cf8c1d0450b32897701" }

# A call's voice, native: the echo canceller hears what plays.
cpal = { version = "0.18", optional = true }
sonora = { version = "0.3", optional = true }
unsafe-libopus = { version = "0.2", optional = true }

[features]
voice = ["dep:cpal", "dep:sonora", "dep:unsafe-libopus"]

[target.'cfg(not(target_os = "android"))'.dependencies]
# Desktops trust what the system trusts: a network that inspects TLS too.
iroh = { version = "1.4", default-features = false, features = ["platform-verifier"] }

[dev-dependencies]
iroh-relay = { version = "1.4", default-features = false, features = [
  "server", "tls-aws-lc-rs",
] }
tracing-subscriber.workspace = true
