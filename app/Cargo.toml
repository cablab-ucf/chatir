[package]
name = "chatir-app"
description = "chatir on desktops and phones"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "chatir_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chatir-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chatir-core.workspace = true
chatir-math.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
data-encoding = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Files shared from this device are chosen by path: never copied.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# In the tray, and from login: notified whether its window is open or not.
tauri-plugin-autostart = "2"

# A call's voice, native: everywhere but iOS, whose web view keeps it.
[target.'cfg(not(target_os = "ios"))'.dependencies]
chatir-core = { workspace = true, features = ["voice"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
# Whether the tray's library is there (without it, the tray panics).
libloading = "0.9"

# The data folder out of backups (setup); already in Tauri's tree.
# Whether a laptop runs on battery (nap only then).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSValue", "NSError"] }

# A push wake with no activity running (android.rs, Push.kt).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
# The phone's one pushir device, shared by every pushir app (pushir's
# Android library, android/pushir): its JNI lives in our native library.
pushir = { git = "https://github.com/cablab-ucf/pushir", rev = "04c89d01832e73df15c16977272ca0aaf1d3ef23", features = ["jni"] }

[features]
# Built without `cargo tauri` (package.nix): the page from the binary.
custom-protocol = ["tauri/custom-protocol"]
