[workspace]
resolver = "3"
members = ["core", "math", "tui", "app"]
default-members = ["core", "math", "tui", "app"]

[workspace.package]
version = "0.4.15"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cablab-ucf/chatir"

[workspace.dependencies]
chatir-core = { path = "core" }
chatir-math = { path = "math" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

# Small everywhere but where it runs per message or per 20 ms of voice:
# the ciphers, hashes, KEM and signatures, and the Opus codec.
[profile.release.package.blake3]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.ml-kem]
opt-level = 3
[profile.release.package.x-wing]
opt-level = 3
[profile.release.package.curve25519-dalek]
opt-level = 3
[profile.release.package.ed25519-dalek]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.sha3]
opt-level = 3
[profile.release.package.keccak]
opt-level = 3
[profile.release.package.unsafe-libopus]
opt-level = 3
[profile.release.package.aws-lc-sys]
opt-level = 3
[profile.release.package.aws-lc-rs]
opt-level = 3
